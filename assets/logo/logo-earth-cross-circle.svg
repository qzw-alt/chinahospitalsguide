<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 背景：暖米白 -->
  <defs><clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath></defs>
        <rect width="400" height="400" fill="#fdf8f3" clip-path="url(#circle)"/>

  <!-- ===== 左半边：地球（亚洲突出）====== -->
  <!-- 地球主体（半圆） -->
  <circle cx="120" cy="200" r="100" fill="#e8f0f5" stroke="#3a4a5c" stroke-width="2"/>

  <!-- 地球经线（半球感） -->
  <ellipse cx="120" cy="200" rx="100" ry="40" fill="none" stroke="#3a4a5c" stroke-width="1" opacity="0.4"/>
  <ellipse cx="120" cy="200" rx="60" ry="100" fill="none" stroke="#3a4a5c" stroke-width="1" opacity="0.4"/>
  <ellipse cx="120" cy="200" rx="30" ry="100" fill="none" stroke="#3a4a5c" stroke-width="1" opacity="0.4"/>

  <!-- 亚洲大陆轮廓（突出，象征患者来源全球） -->
  <path d="M 100 130
           Q 115 115 140 110
           Q 165 108 180 125
           Q 195 145 188 165
           Q 195 175 200 180
           Q 210 195 200 210
           Q 190 220 175 215
           Q 165 230 150 235
           Q 130 240 115 225
           Q 100 210 95 190
           Q 85 175 88 155
           Q 92 140 100 130 Z"
        fill="#7ba05b" opacity="0.85"/>

  <!-- 非洲轮廓（次要） -->
  <path d="M 115 220
           Q 110 235 115 255
           Q 122 275 130 280
           Q 138 270 135 250
           Q 130 235 115 220 Z"
        fill="#7ba05b" opacity="0.7"/>

  <!-- 欧洲轮廓（次要） -->
  <path d="M 100 130
           Q 95 120 105 115
           Q 115 113 125 118
           Q 130 128 125 138
           Q 115 140 100 130 Z"
        fill="#7ba05b" opacity="0.7"/>

  <!-- 美洲轮廓（次要，象征拉美客户） -->
  <path d="M 70 175
           Q 60 200 65 225
           Q 75 250 85 260
           Q 90 240 85 215
           Q 78 190 70 175 Z"
        fill="#7ba05b" opacity="0.7"/>

  <!-- ===== 飞机轨迹线：从地球飞向中国位置 ===== -->
  <!-- 弧线轨迹（动态感） -->
  <path d="M 200 175
           Q 240 140 280 175"
        stroke="#3a4a5c" stroke-width="2.5"
        fill="none"
        stroke-dasharray="6 4"
        stroke-linecap="round"/>

  <!-- 小飞机（极简） -->
  <g transform="translate(245, 130) rotate(35)">
    <path d="M -8 0 L 6 0 L 8 -2 L 6 2 L -8 2 Z" fill="#3a4a5c"/>
    <path d="M 0 -6 L 3 0 L 0 6 L -3 0 Z" fill="#3a4a5c"/>
  </g>

  <!-- ===== 右半边：医院十字 + 中国地图位置 ===== -->
  <!-- 中国地图轮廓（浅灰底纹） -->
  <path d="M 295 130
           Q 305 115 325 110
           Q 345 108 355 125
           Q 365 145 360 165
           Q 370 180 365 200
           Q 360 220 350 235
           Q 360 250 345 265
           Q 325 275 305 270
           Q 290 265 285 250
           Q 280 230 285 215
           Q 275 195 280 180
           Q 275 160 280 145
           Q 285 135 295 130 Z"
        fill="none" stroke="#5a6b7d" stroke-width="1.5"
        stroke-dasharray="4 3" opacity="0.5"/>

  <!-- 医院十字（主图，清晰、矢量） -->
  <g transform="translate(320, 195)">
    <!-- 十字底（白色填充 + 深色描边） -->
    <path d="M -22 -55
             L 22 -55
             L 22 -22
             L 55 -22
             L 55 22
             L 22 22
             L 22 55
             L -22 55
             L -22 22
             L -55 22
             L -55 -22
             L -22 -22 Z"
          fill="#ffffff" stroke="#c92a2a" stroke-width="6"/>

    <!-- 十字内部小红星（中国位置感） -->
    <circle cx="0" cy="0" r="8" fill="#c92a2a"/>
    <!-- 红星边角 -->
    <g fill="#c92a2a" opacity="0.85">
      <polygon points="-15,-30 -13,-26 -9,-26 -12,-23 -10,-19 -15,-22 -20,-19 -18,-23 -21,-26 -17,-26" transform="scale(0.5) translate(0,0)"/>
    </g>
  </g>

  <!-- ===== 连接元素：脉冲线（医疗感） ===== -->
  <!-- 一条心电波在飞机轨迹下方，连接两半 -->
  <path d="M 230 195
           L 250 195
           L 255 185
           L 262 205
           L 270 175
           L 278 210
           L 286 195
           L 295 195"
        stroke="#c92a2a" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== 品牌名 ===== -->
  <text x="200" y="370" text-anchor="middle"
        font-family="Georgia, serif" font-size="13"
        fill="#3a4a5c" font-weight="600"
        letter-spacing="2.5">CHINA HOSPITALS GUIDE</text>

  <!-- 小副标：MEDICAL TRAVEL COORDINATION -->
  <text x="200" y="390" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="8"
        fill="#5a6b7d" font-weight="400"
        letter-spacing="3">MEDICAL TRAVEL COORDINATION</text>
</svg>