<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 背景：温暖米白 -->
  <defs><clipPath id="circle"><circle cx="200" cy="200" r="200"/></clipPath></defs>
        <rect width="400" height="400" fill="#fdf8f3" clip-path="url(#circle)"/>

  <!-- 银杏叶主形状（参考真实银杏扇形） -->
  <!-- 银杏叶外轮廓：从底部叶柄开始，向外扇形展开 -->
  <path d="M 200 360
           Q 195 320 192 280
           Q 188 240 190 200
           Q 192 160 200 130
           Q 208 100 220 75
           Q 235 55 258 50
           Q 282 48 308 60
           Q 335 75 355 100
           Q 372 130 375 165
           Q 372 200 358 232
           Q 340 265 315 290
           Q 285 315 250 335
           Q 220 350 200 360 Z"
        fill="#d4622a" opacity="0.95"/>

  <!-- 银杏叶中央裂口（标志性扇形） -->
  <path d="M 200 130
           L 200 360
           L 195 320
           L 195 280
           L 198 240
           L 200 200
           L 202 160 Z"
        fill="#fdf8f3" opacity="0.95"/>

  <!-- 叶脉（银杏叶典型扇形放射状叶脉） -->
  <g stroke="#8b3a14" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M 200 350 Q 210 280 230 220 Q 260 150 290 100"/>
    <path d="M 200 350 Q 190 280 175 220 Q 155 150 140 110"/>
    <path d="M 200 350 Q 220 290 260 230 Q 300 175 340 145"/>
    <path d="M 200 350 Q 180 290 145 235 Q 110 180 80 155"/>
    <path d="M 200 350 Q 200 280 200 200 Q 200 130 200 80"/>
    <path d="M 200 350 Q 230 310 280 270 Q 330 235 365 220"/>
  </g>

  <!-- 心电图波（嵌入在银杏叶中央裂口） -->
  <path d="M 145 245
           L 175 245
           L 180 230
           L 187 260
           L 195 215
           L 203 270
           L 210 240
           L 218 250
           L 230 245
           L 255 245"
        stroke="#c92a2a" stroke-width="3.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 听诊器（绕过叶柄右侧） -->
  <!-- 听诊器主管：从右下方弯到叶柄 -->
  <path d="M 320 360
           Q 320 340 310 325
           Q 290 305 270 290
           Q 240 270 220 310
           Q 210 335 220 355"
        stroke="#3a4a5c" stroke-width="6" fill="none"
        stroke-linecap="round"/>

  <!-- 听诊器耳件（左耳） -->
  <circle cx="324" cy="362" r="8" fill="#3a4a5c"/>

  <!-- 听诊器耳件（右耳） -->
  <circle cx="216" cy="358" r="8" fill="#3a4a5c"/>

  <!-- 听诊器头（落在银杏叶上） -->
  <circle cx="220" cy="310" r="13" fill="#5a6b7d" stroke="#3a4a5c" stroke-width="2"/>
  <circle cx="220" cy="310" r="6" fill="#1a2330"/>

  <!-- 顶部中国元素：1 颗小星 + 1 颗大星（极简国旗元素，象征中国但不浓烈） -->
  <g fill="#c92a2a" opacity="0.85">
    <polygon points="40,55 42,62 49,62 43,66 45,73 40,68 35,73 37,66 31,62 38,62" />
    <polygon points="60,40 62,47 69,47 63,51 65,58 60,53 55,58 57,51 51,47 58,47" />
  </g>

  <!-- 底部品牌缩写 CHG -->
  <text x="200" y="385" text-anchor="middle"
        font-family="Georgia, serif" font-size="14"
        fill="#8b3a14" font-weight="600"
        letter-spacing="3">CHINA HOSPITALS GUIDE</text>
</svg>