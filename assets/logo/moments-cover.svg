<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400">
  <!-- 背景：暖米白渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf8f3"/>
      <stop offset="100%" stop-color="#f4ece1"/>
    </linearGradient>
    <linearGradient id="accreg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c92a2a"/>
      <stop offset="100%" stop-color="#d4622a"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="400" fill="url(#bg)"/>

  <!-- 装饰：右上一道淡弧线 -->
  <path d="M 1080 0 Q 900 100 1080 200 Z" fill="#c92a2a" opacity="0.04"/>

  <!-- 装饰：左下一道淡弧线 -->
  <path d="M 0 400 Q 180 300 0 200 Z" fill="#3a4a5c" opacity="0.04"/>

  <!-- ===== 左：logo（嵌入之前设计的）====== -->
  <g transform="translate(80, 80) scale(0.6)">
    <!-- 地球 -->
    <circle cx="120" cy="200" r="100" fill="#e8f0f5" stroke="#3a4a5c" stroke-width="2"/>
    <ellipse cx="120" cy="200" rx="100" ry="40" fill="none" stroke="#3a4a5c" stroke-width="1" opacity="0.4"/>
    <ellipse cx="120" cy="200" rx="60" ry="100" fill="none" stroke="#3a4a5c" stroke-width="1" opacity="0.4"/>
    <ellipse cx="120" cy="200" rx="30" ry="100" fill="none" stroke="#3a4a5c" stroke-width="1" opacity="0.4"/>
    <!-- 亚洲 -->
    <path d="M 100 130 Q 115 115 140 110 Q 165 108 180 125 Q 195 145 188 165 Q 195 175 200 180 Q 210 195 200 210 Q 190 220 175 215 Q 165 230 150 235 Q 130 240 115 225 Q 100 210 95 190 Q 85 175 88 155 Q 92 140 100 130 Z" fill="#7ba05b" opacity="0.85"/>
    <!-- 飞机轨迹 -->
    <path d="M 200 175 Q 240 140 280 175" stroke="#3a4a5c" stroke-width="2.5" fill="none" stroke-dasharray="6 4" stroke-linecap="round"/>
    <!-- 医院十字 -->
    <g transform="translate(320, 195)">
      <path d="M -22 -55 L 22 -55 L 22 -22 L 55 -22 L 55 22 L 22 22 L 22 55 L -22 55 L -22 22 L -55 22 L -55 -22 L -22 -22 Z" fill="#ffffff" stroke="#c92a2a" stroke-width="6"/>
      <circle cx="0" cy="0" r="8" fill="#c92a2a"/>
    </g>
  </g>

  <!-- ===== 中：主标语 ===== -->
  <g transform="translate(540, 165)">
    <!-- 主标语 -->
    <text x="0" y="0" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="42" font-weight="700"
          fill="#3a4a5c" letter-spacing="0.5">
      Find the right hospital
    </text>
    <text x="0" y="55" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="42" font-weight="700"
          fill="#c92a2a" letter-spacing="0.5">
      in China
    </text>

    <!-- 副标语 -->
    <text x="0" y="105" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="14" font-weight="400"
          fill="#5a6b7d" letter-spacing="4">
      MEDICAL TRAVEL COORDINATION
    </text>

    <!-- 装饰线 -->
    <line x1="-180" y1="135" x2="-50" y2="135" stroke="#c92a2a" stroke-width="1.5" opacity="0.6"/>
    <line x1="50" y1="135" x2="180" y2="135" stroke="#c92a2a" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="135" r="3" fill="#c92a2a"/>
  </g>

  <!-- ===== 右：URL + 联系方式 ===== -->
  <g transform="translate(870, 0)">
    <!-- 主 URL -->
    <text x="0" y="180" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="24" font-weight="700"
          fill="#3a4a5c">
      chinahospitalsguide
    </text>
    <text x="0" y="210" text-anchor="middle"
          font-family="Georgia, serif"
          font-size="24" font-weight="700"
          fill="#c92a2a">
      .com
    </text>

    <!-- 副联系方式 -->
    <text x="0" y="245" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#5a6b7d" letter-spacing="1">
      WeChat · Telegram
    </text>
    <text x="0" y="262" text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="11"
          fill="#5a6b7d" letter-spacing="1">
      +86 157 6310 7083
    </text>
  </g>

  <!-- 底部细线 + 副标 -->
  <line x1="80" y1="370" x2="1000" y2="370" stroke="#3a4a5c" stroke-width="0.5" opacity="0.2"/>
  <text x="540" y="388" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="10"
        fill="#5a6b7d" letter-spacing="3">
    HOSPITAL SHORTLISTING · COST COMPARISON · ARRIVAL SUPPORT
  </text>
</svg>