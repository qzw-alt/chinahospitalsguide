<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 7 - 复盘洞见</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 1080px; height: 1080px; background: linear-gradient(135deg, #17345f 0%, #2a5298 100%); color: white; padding: 80px 90px; display: flex; flex-direction: column; }
  .tag { display: inline-block; padding: 8px 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; font-size: 18px; letter-spacing: 0.05em; margin-bottom: 40px; width: fit-content; }
  .title { font-size: 52px; font-weight: 700; line-height: 1.3; margin-bottom: 60px; }
  .items { display: flex; flex-direction: column; gap: 28px; flex: 1; }
  .item { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 32px; display: flex; gap: 25px; align-items: flex-start; }
  .item .num { font-size: 38px; font-weight: 700; color: #ff6b6b; min-width: 60px; line-height: 1; }
  .item .body { flex: 1; }
  .item .head { font-size: 24px; font-weight: 600; margin-bottom: 8px; color: white; }
  .item .desc { font-size: 18px; color: rgba(255,255,255,0.75); line-height: 1.6; }
  .footer { margin-top: 40px; font-size: 16px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="card">
  <span class="tag">复盘 · 3 条洞见</span>
  <h1 class="title">这一单做完<br>我重新理解了这件事</h1>
  <div class="items">
    <div class="item">
      <div class="num">01</div>
      <div class="body">
        <div class="head">复杂病 ≠ 走 3 家医院</div>
        <div class="desc">并发 3 个病种的患者，最该做的不是分头挂号。是找一家有同行网络的主诊医院，让它牵头收口</div>
      </div>
    </div>
    <div class="item">
      <div class="num">02</div>
      <div class="body">
        <div class="head">「愿意牵头 MDT」是稀缺资源</div>
        <div class="desc">绝大多数医院只想治自己科室的病。能跨科室 / 跨院邀请外部专家的主诊医院，在国内屈指可数</div>
      </div>
    </div>
    <div class="item">
      <div class="num">03</div>
      <div class="body">
        <div class="head">国际化 ≠ 挂英文网站</div>
        <div class="desc">跨境患者真正卡的是：不会中文 / 没法自己拼凑病例 / 没人帮忙跑通 MDT。这三件事医院端不做</div>
      </div>
    </div>
  </div>
  <p class="footer">CHINA HOSPITALS GUIDE · 跨境患者通道共建</p>
</div>
</body>
</html>
