<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 8 - CTA 收尾</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0c1830 0%, #1e3c72 100%); color: white; padding: 100px 90px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255,107,107,0.15), transparent 70%); border-radius: 50%; }
  .card::after { content: ''; position: absolute; bottom: -150px; left: -150px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(42,82,152,0.4), transparent 70%); border-radius: 50%; }
  .content { position: relative; z-index: 1; width: 100%; }
  .label { font-size: 18px; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; margin-bottom: 30px; }
  .head { font-size: 64px; font-weight: 700; line-height: 1.25; margin-bottom: 50px; }
  .head em { color: #ff6b6b; font-style: normal; }
  .sub { font-size: 26px; color: rgba(255,255,255,0.85); line-height: 1.6; margin-bottom: 60px; }
  .cta { display: inline-flex; align-items: center; gap: 16px; padding: 22px 42px; background: #ff6b6b; color: white; border-radius: 999px; font-size: 24px; font-weight: 700; box-shadow: 0 10px 30px rgba(255,107,107,0.4); }
  .footer { position: relative; z-index: 1; margin-top: auto; font-size: 16px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; padding-top: 40px; }
</style>
</head>
<body>
<div class="card">
  <div class="content">
    <div class="label">合作邀请</div>
    <h1 class="head">如果你所在科室<br>在考虑<em>国际化</em>这件事</h1>
    <p class="sub">我们一起看：现有国际患者结构、想做的下一步、<br>哪些模式适合。三句话能聊清楚</p>
    <div class="cta">微信直接私信 →</div>
  </div>
  <p class="footer">CHINA HOSPITALS GUIDE · 跨境患者通道共建</p>
</div>
</body>
</html>
