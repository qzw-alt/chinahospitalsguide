<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图 2 - 病种复杂度</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 1080px; height: 1080px; background: linear-gradient(135deg, #0c1830 0%, #1e3c72 100%); color: white; padding: 80px 90px; display: flex; flex-direction: column; justify-content: center; }
  .tag { display: inline-block; padding: 8px 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 999px; font-size: 18px; letter-spacing: 0.05em; margin-bottom: 50px; width: fit-content; }
  .title { font-size: 56px; font-weight: 700; line-height: 1.3; margin-bottom: 30px; }
  .subtitle { font-size: 26px; color: rgba(255,255,255,0.75); margin-bottom: 60px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; margin-bottom: 50px; }
  .stat { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 16px; padding: 30px; }
  .stat .num { font-size: 52px; font-weight: 700; color: white; margin-bottom: 8px; }
  .stat .lbl { font-size: 18px; color: rgba(255,255,255,0.7); }
  .footnote { font-size: 18px; color: rgba(255,255,255,0.55); border-top: 1px solid rgba(255,255,255,0.15); padding-top: 25px; line-height: 1.6; }
  .footer { margin-top: 30px; font-size: 16px; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; }
</style>
</head>
<body>
<div class="card">
  <span class="tag">本周案例 · 国际患者</span>
  <h1 class="title">3 个并发血管/内脏病<br>单一医院收口</h1>
  <p class="subtitle">拉美患者 · 病史 4.5 年 · 体重 40kg 出头 · 不会中文</p>
  <div class="stats">
    <div class="stat">
      <div class="num">3</div>
      <div class="lbl">病种并发<br>罕见血管 + 内脏压迫</div>
    </div>
    <div class="stat">
      <div class="num">1</div>
      <div class="lbl">主诊医院窗口<br>跨院专家 MDT</div>
    </div>
    <div class="stat">
      <div class="num">0</div>
      <div class="lbl">多城奔波<br>不出国即收口</div>
    </div>
  </div>
  <p class="footnote">
    核心解法不是「找 3 家医院」，是「找 1 家有同行网络的医院牵头」。<br>
    主诊医院 → 邀请外部专家 → 一次 MDT 视频会诊 → 完整方案落地。
  </p>
  <div class="footer">CHINA HOSPITALS GUIDE · 跨境患者通道共建</div>
</div>
</body>
</html>
